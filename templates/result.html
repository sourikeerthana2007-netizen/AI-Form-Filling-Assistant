<!DOCTYPE html>
<html>
<head>
    <title>OCR Result - Smart Form Fill AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            height: 400px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔍 Form Scanned Successfully</h1>

    <p>OCR extracted this text from your form:</p>

    <textarea readonly>{{ text }}</textarea>

    <br>

    <a class="back" href="/">
        ← Upload Another Form
    </a>

</div>

</body>
</html>
